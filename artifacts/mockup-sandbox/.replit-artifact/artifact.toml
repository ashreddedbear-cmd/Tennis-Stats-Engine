kind = "web"
previewPath = "/__mockup/"
title = "Canvas"
version = "1.0.0"
id = "artifacts/mockup-sandbox"
router = "path"

[[services]]
name = "web"
paths = [ "/__mockup/" ]
localPort = 22554

[services.development]
run = "pnpm --filter @workspace/mockup-sandbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mockup-sandbox", "run", "build" ]
serve = "static"
publicDir = "artifacts/mockup-sandbox/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22554"
BASE_PATH = "/__mockup/"
