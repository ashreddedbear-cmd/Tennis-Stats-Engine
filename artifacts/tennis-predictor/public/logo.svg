<svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clip-path id="tmClip">
      <circle cx="24" cy="24" r="23.5"/>
    </clip-path>
    <radialGradient id="tmBase" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#071307"/>
      <stop offset="100%" stop-color="#010401"/>
    </radialGradient>
    <filter id="tmSeamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base dark circle -->
  <circle cx="24" cy="24" r="24" fill="url(#tmBase)"/>

  <!-- Clipped content -->
  <g clip-path="url(#tmClip)">

    <!-- Matrix rain columns -->
    <line x1="8"  y1="4"  x2="8"  y2="44" stroke="#00ff41" stroke-width="0.6" stroke-dasharray="2.5 3.5 1.5 5 3 4 2 6"       opacity="0.13"/>
    <line x1="16" y1="2"  x2="16" y2="46" stroke="#00ff41" stroke-width="0.6" stroke-dasharray="1.5 4 3 3.5 2 5.5 1.5 4"     opacity="0.1"/>
    <line x1="24" y1="3"  x2="24" y2="45" stroke="#00ff41" stroke-width="0.6" stroke-dasharray="3 3 2 5 1.5 4.5 2.5 3"       opacity="0.1"/>
    <line x1="32" y1="2"  x2="32" y2="46" stroke="#00ff41" stroke-width="0.6" stroke-dasharray="2 4.5 3 3 1.5 5 2 4"         opacity="0.1"/>
    <line x1="40" y1="4"  x2="40" y2="44" stroke="#00ff41" stroke-width="0.6" stroke-dasharray="1.5 5 2.5 3 3 4 1.5 5.5"     opacity="0.13"/>

    <!-- PCB-trace tennis seam — TOP -->
    <path d="M 1 24 L 5 24 L 5 19 L 10 19 L 10 13 L 18 13 L 18 19 L 30 19 L 30 13 L 38 13 L 38 19 L 43 19 L 43 24 L 47 24"
          fill="none" stroke="#00ff41" stroke-width="1.7" stroke-linejoin="miter" stroke-linecap="butt"
          opacity="0.92" filter="url(#tmSeamGlow)"/>

    <!-- PCB-trace tennis seam — BOTTOM -->
    <path d="M 1 24 L 5 24 L 5 29 L 10 29 L 10 35 L 18 35 L 18 29 L 30 29 L 30 35 L 38 35 L 38 29 L 43 29 L 43 24 L 47 24"
          fill="none" stroke="#00ff41" stroke-width="1.7" stroke-linejoin="miter" stroke-linecap="butt"
          opacity="0.92" filter="url(#tmSeamGlow)"/>

    <!-- PCB nodes — TOP -->
    <rect x="3.5"  y="17.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="8.5"  y="11.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="16.5" y="11.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="16.5" y="17.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="28.5" y="17.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="28.5" y="11.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="36.5" y="11.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="36.5" y="17.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="41.5" y="17.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>

    <!-- PCB nodes — BOTTOM -->
    <rect x="3.5"  y="27.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="8.5"  y="33.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="16.5" y="33.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="16.5" y="27.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="28.5" y="27.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="28.5" y="33.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="36.5" y="33.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="36.5" y="27.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>
    <rect x="41.5" y="27.5" width="3" height="3" fill="#00ff41" opacity="0.95"/>

  </g>

  <!-- Outer ring -->
  <circle cx="24" cy="24" r="23" fill="none" stroke="#00ff41" stroke-width="0.9" opacity="0.65"/>

  <!-- Center targeting reticle -->
  <line x1="20.5" y1="24"   x2="27.5" y2="24"   stroke="#00ff41" stroke-width="0.9" opacity="0.85"/>
  <line x1="24"   y1="20.5" x2="24"   y2="27.5" stroke="#00ff41" stroke-width="0.9" opacity="0.85"/>
  <!-- Center node -->
  <rect x="22.5" y="22.5" width="3" height="3" fill="#00ff41" opacity="1"/>
</svg>
