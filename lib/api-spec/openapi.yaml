          description: Which provider (The Odds API or Odds-API.io) supplied the odds below, null when neither had this matchup at lock time
        oddsPlayer1Decimal:
          type: ["number", "null"]
          description: Real decimal odds for player1, captured at lock time
        oddsPlayer2Decimal:
          type: ["number", "null"]
          description: Real decimal odds for player2, captured at lock time
        oddsFetchedAt:
          type: ["string", "null"]
          format: date-time
        impliedProbability:
          type: ["number", "null"]
          description: Vig-adjusted implied probability of player1 winning, 0-100
        marketEdge:
          type: ["number", "null"]
          description: Market edge oriented to the model's own pick (predictedWinnerProbability minus the implied probability for that same side). Positive means the model found more value than the market priced in.

    CalibrationBucket:
      type: object
      required: [label, min, max, n, avgPredicted, observedAccuracy]
      properties:
        label:
          type: string
        min:
          type: number
        max:
          type: number
        n:
          type: integer
        avgPredicted:
          type: ["number", "null"]
        observedAccuracy:
          type: ["number", "null"]

    StreakSummary:
      type: object
      required: [currentStreakType, currentStreakLength, longestWinStreak, longestLossStreak]
      properties:
        currentStreakType:
          type: ["string", "null"]
          enum: [win, loss, null]
        currentStreakLength:
          type: integer
        longestWinStreak:
          type: integer
        longestLossStreak:
          type: integer

    EvaluationDashboardSegment:
      type: object
      required: [key, label, isGenuinelyUnseen, metrics, calibrationBuckets, streaks]
      properties:
        key:
          type: string
        label:
          type: string
        isGenuinelyUnseen:
          type: boolean
          description: True for test/paper-trade/live; false for validation (used for fitting calibration)
        metrics:
          $ref: "#/components/schemas/SegmentMetrics"
        calibrationBuckets:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationBucket"
        streaks:
          $ref: "#/components/schemas/StreakSummary"

    SpecialistSegmentSummary:
      type: object
      description: Phase 6 tour/surface specialist segment breakdown, always shown with its sample sizes so a small sample is never presented as a strong result
      required:
        [segmentKey, tour, surface, label, historicalMatchCount, meetsThreshold, validationSampleSize, weight]
      properties:
        segmentKey:
          type: string
        tour:
          type: string
        surface:
          type: string
        label:
          type: string
        historicalMatchCount:
          type: integer
          description: Real historical matches in this tour/surface segment (Phase 3 coverage check)
        meetsThreshold:
          type: boolean
          description: Whether this segment has enough real data to run its own specialist calibration at all
        validationSampleSize:
          type: integer
        accuracy:
          type: ["number", "null"]
          description: This segment's own calibration accuracy on its validation-segment points
        logLoss:
          type: ["number", "null"]
        brier:
          type: ["number", "null"]
        generalAccuracy:
          type: ["number", "null"]
          description: The general (pooled) model's accuracy on the SAME segment-scoped validation points, for a fair comparison
        generalLogLoss:
          type: ["number", "null"]
        generalBrier:
          type: ["number", "null"]
        weight:
          type: number
          description: This segment's measured blend weight (0-1) against the general model in live predictions; 0 when meetsThreshold is false
        computedAt:
          type: string
          format: date-time

    EliteTierBacktest:
      type: object
      description: >-
        Task 46: real backtest of the Elite Prediction tier against genuinely-unseen graded
        outcomes (historical_test test-segment + paper_trade/live), scored with the exact same
        accuracy/logLoss/brier/ECE methodology as every other segment. "nearElite" is a
        backtest-only comparison group -- every Elite gate met except segment-specialist support,
        which is structurally unobservable during historical walk-forward scoring -- and never
        affects which tier is shown as "Elite" in the live prediction UI.
      required: [minSampleSize, elite, eliteMeetsMinSample, nearElite, nearEliteMeetsMinSample]
      properties:
        minSampleSize:
          type: integer
          description: Minimum n before either group's numbers are considered meaningful (matches the project's existing 30-sample convention for specialist segments and simulator validation)
        elite:
          $ref: "#/components/schemas/SegmentMetrics"
        eliteMeetsMinSample:
          type: boolean
        nearElite:
          $ref: "#/components/schemas/SegmentMetrics"
        nearEliteMeetsMinSample:
          type: boolean

    UpsetRiskTierMetrics:
      type: object
      description: >-
        Favorite-loss-rate for one upset-risk tier (LOW/MODERATE/HIGH/EXTREME), scoped to
        honestly-graded, accuracy-eligible rows that have a persisted tier. Task 56: since
        computeUpsetRisk is a pure downstream classifier of the already-calibrated probability
        (it never feeds back into calibratedProbability), its validation is tier-level
        monotonicity -- favoriteLossRate should rise from LOW toward EXTREME -- not a
        before/after accuracy delta.
      required: [tier, n, favoriteLossRate]
      properties:
        tier:
          type: string
        n:
          type: integer
        favoriteLossRate:
          type: ["number", "null"]

    DisagreementTierMetrics:
      type: object
      description: >-
        Accuracy/error-rate for one model-agreement tier (Strong/Moderate/Mixed/
        HighDisagreement), same scoping as UpsetRiskTierMetrics. computeWeightedDisagreement is
        also a pure downstream classifier -- accuracy should fall (error rate rise) from Strong
        toward HighDisagreement if the tier is doing real work.
      required: [tier, n, accuracy, errorRate]
      properties:
        tier:
          type: string
        n:
          type: integer
        accuracy:
          type: ["number", "null"]
        errorRate:
          type: ["number", "null"]

    MarketEdgeSummary:
      type: object
      description: >-
        Task 47: rolling average edge between the model's calibrated probability and real,
        vig-adjusted market-implied probability, oriented to the model's own pick. A distinct
        metric from accuracy/logLoss/Brier/ECE -- it measures agreement with the market, not with
        the eventual real-world outcome.
      required: [n, averageEdge]
      properties:
        n:
          type: integer
          description: How many graded/void paper-trade rows actually had real odds (and therefore an edge value) at lock time
        averageEdge:
          type: ["number", "null"]
          description: Average market edge in percentage points; null when n=0. Positive means the model found more value in its pick than the market priced in.

    EvaluationDashboard:
      type: object
      required:
        [
          segments,
          activeCalibrationSampleSize,
          activeCalibrationMethod,
          specialistSegments,
          eliteTierBacktest,
          upsetRiskTierMetrics,
          disagreementTierMetrics,
          marketEdge,
        ]
      properties:
        segments:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationDashboardSegment"
        activeCalibrationSampleSize:
          type: integer
          description: How many validation-segment predictions the live paper-trading calibration was fit on
        activeCalibrationMethod:
          type: ["string", "null"]
          enum: [isotonic, platt, null]
          description: Which method (isotonic or Platt/sigmoid) won the holdout comparison and is currently active
        activeCalibrationIsotonicHoldoutLogLoss:
          type: ["number", "null"]
          description: Isotonic method's log loss on the held-out comparison slice at the last refit
        activeCalibrationPlattHoldoutLogLoss:
          type: ["number", "null"]
          description: Platt method's log loss on the held-out comparison slice at the last refit
        specialistSegments:
          type: array
          items:
            $ref: "#/components/schemas/SpecialistSegmentSummary"
        eliteTierBacktest:
          $ref: "#/components/schemas/EliteTierBacktest"
        upsetRiskTierMetrics:
          type: array
          items:
            $ref: "#/components/schemas/UpsetRiskTierMetrics"
        disagreementTierMetrics:
          type: array
          items:
            $ref: "#/components/schemas/DisagreementTierMetrics"
        marketEdge:
          $ref: "#/components/schemas/MarketEdgeSummary"

    RunShadowReplayRequest:
      type: object
      required: [startDate, endDate, batchLabel]
      properties:
        startDate:
          type: string
          description: >-
            Inclusive UTC calendar date (YYYY-MM-DD) to start replaying from. Deliberately typed
            as a plain string, not format:date -- this codebase's zod codegen coerces any
            format:date/date-time REQUEST body field straight to a JS Date, which would silently
            mangle a bare "2026-06-01" into a full timestamp before the service layer's own
            explicit YYYY-MM-DD parsing/validation ever sees it.
        endDate:
          type: string
          description: Inclusive UTC calendar date (YYYY-MM-DD) to replay through. See startDate's note on why this isn't format:date.
        batchLabel:
          type: string
          minLength: 1
          description: Identifies this replay invocation/group; distinct batches never collide or overwrite each other
        overwrite:
          type: boolean
          default: false
          description: >-
            When true, first deletes ONLY this exact batch's own existing paper_trade_shadow rows,
            then replays the range fresh under the same label. Never touches any other batch, and
            never touches paper_trade/historical_test rows regardless of this flag.

    ShadowReplaySummary:
      type: object
      required:
        [batchLabel, startDate, endDate, overwrite, deletedExistingBatchRows, matchesInRange, inserted, skippedAlreadyClaimed, skippedInsufficientData, daysSimulated]
      properties:
        batchLabel:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        overwrite:
          type: boolean
        deletedExistingBatchRows:
          type: integer
          description: Rows deleted because overwrite=true and this exact batch already had rows; 0 otherwise
        matchesInRange:
          type: integer
          description: Real, non-cancelled historical matches whose scheduledStartAt fell within the requested range
        inserted:
          type: integer
          description: Newly written this run
        skippedAlreadyClaimed:
          type: integer
          description: Matches in range already claimed by this or another shadow batch -- append-only skip, never a duplicate or a rescoring
        skippedInsufficientData:
          type: integer
          description: scoreHistoricalMatch returned null (insufficient prior history) -- never inserted, never a fabricated guess
        daysSimulated:
          type: integer
          description: Distinct UTC calendar days actually walked while pacing this replay

    ShadowReplayBatchSummary:
      type: object
      required: [batchLabel, n, dateRangeStart, dateRangeEnd, earliestLockedAt, latestLockedAt]
      properties:
        batchLabel:
          type: string
        n:
          type: integer
        dateRangeStart:
          type: ["string", "null"]
          format: date-time
        dateRangeEnd:
          type: ["string", "null"]
          format: date-time
        earliestLockedAt:
          type: ["string", "null"]
          format: date-time
        latestLockedAt:
          type: ["string", "null"]
          format: date-time

    ShadowReplayDashboard:
      type: object
      description: >-
        Simulated evidence only -- see RunKind's paper_trade_shadow description. Always rendered
        as its own clearly-labeled section, never combined with GetEvaluationDashboardResponse's
        genuinely-live/backtest segments.
      required: [overall, calibrationBuckets, batches]
      properties:
        overall:
          $ref: "#/components/schemas/SegmentMetrics"
        calibrationBuckets:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationBucket"
        batches:
          type: array
          items:
            $ref: "#/components/schemas/ShadowReplayBatchSummary"

    PredictionSettings:
      type: object
      required: [retirementRule, paperTradeLeadMinutes]
      properties:
        retirementRule:
          type: string
          enum: [excluded, included]
        paperTradeLeadMinutes:
          type: integer

    UpdatePredictionSettingsRequest:
      type: object
      properties:
        retirementRule:
          type: string
          enum: [excluded, included]
        paperTradeLeadMinutes:
          type: integer
          minimum: 1
          maximum: 1440

    PaperTradingCycleSummary:
      type: object
      required: [locked, missed, graded, errors]
      properties:
        locked:
          type: integer
        missed:
          type: integer
        graded:
          type: integer
        errors:
          type: array
          items:
            type: string

    HistoricalBackfillCycleSummary:
      type: object
      required:
        - dateStart
        - dateStop
        - cutoff
        - cutoffMinutes
        - fixturesFetched
        - matchesInserted
        - matchesRecomputed
        - matchesSkippedDuplicate
        - matchesSkippedNoTerminalResult
        - featureRowsInserted
        - byTour
        - bySurface
        - earliestImportedMatchDate
        - latestImportedMatchDate
        - durationMs
      properties:
        dateStart:
          type: string
        dateStop:
          type: string
        cutoff:
          type: string
        cutoffMinutes:
          type: integer
        fixturesFetched:
          type: integer
        matchesInserted:
          type: integer
        matchesRecomputed:
          type: integer
        matchesSkippedDuplicate:
          type: integer
        matchesSkippedNoTerminalResult:
          type: integer
        featureRowsInserted:
          type: integer
        byTour:
          type: object
          additionalProperties:
            type: integer
        bySurface:
          type: object
          additionalProperties:
            type: integer
        earliestImportedMatchDate:
          type: string
          nullable: true
        latestImportedMatchDate:
          type: string
          nullable: true
        durationMs:
          type: integer

    HistoricalBackfillCycleResult:
      type: object
      required: [skipped]
      properties:
        skipped:
          type: boolean
        skippedReason:
          type: string
        summary:
          allOf:
            - $ref: "#/components/schemas/HistoricalBackfillCycleSummary"
          nullable: true

    HistoricalDataFreshness:
      type: object
      required: [latestCoveredDate, daysBehind, asOf]
      properties:
        latestCoveredDate:
          type: string
          nullable: true
          description: Most recent scheduledStartAt date already stored in historical_matches (YYYY-MM-DD), or null if the table is empty.
        daysBehind:
          type: integer
          nullable: true
          description: Whole days between latestCoveredDate and today (UTC). Null when latestCoveredDate is null.
        asOf:
          type: string
          format: date-time

    RunHistoricalBackfillRangeRequest:
      type: object
      required: [dateStart, dateStop]
      properties:
        dateStart:
          type: string
          description: First date to backfill, inclusive (YYYY-MM-DD).
        dateStop:
          type: string
          description: Last date to backfill, inclusive (YYYY-MM-DD).
        chunkDays:
          type: integer
          minimum: 1
          description: Provider chunk window in days. Defaults to 5 (the safe limit for busy periods).

    RunHistoricalBackfillRangeResult:
      type: object
      required: [started, dateStart, dateStop]
      properties:
        started:
          type: boolean
        dateStart:
          type: string
        dateStop:
          type: string

    RunAblationAnalysisRequest:
      type: object
      properties:
        sampleSize:
          type: integer
          nullable: true
          description: >-
            When set, scores a proportional stratified sample of roughly this many matches
            (by surface and calendar year) instead of the full historical corpus -- sized to
            complete in one sitting. Omit for a full-corpus run.

    AblationRunResponse:
      type: object
      required: [started]
      properties:
        started:
          type: boolean
        reason:
          type: string
          nullable: true

    AblationStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, running, done, error]
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        sampleSize:
          type: integer
          nullable: true
        # Free-form: { phase, variantIndex, variantCount, matchIndex, matchCount } while running.
        progress:
          nullable: true
        # Free-form: the full AblationReport (baseline/modelDeltas/combinations/diagnostics/sampleInfo) once state is "done".
        report:
          nullable: true
        reportPath:
          type: string
          nullable: true
        markdownPath:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    JobRun:
      type: object
      required: [id, jobName, startedAt, finishedAt, status, attempts]
      properties:
        id:
          type: integer
        jobName:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, failed]
        attempts:
          type: integer
        summary:
          nullable: true
        errorMessage:
          type: string
          nullable: true
