      properties:
        id:
          type: integer
        player1Id:
          type: string
        player1Name:
          type: string
        player2Id:
          type: string
        player2Name:
          type: string
        surface:
          $ref: "#/components/schemas/Surface"
        tournamentName:
          type: ["string", "null"]
        predictedWinnerName:
          type: string
        calibratedProbability:
          type: number
        predictedWinnerProbability:
          type: number
          description: >-
            The predicted winner's own win probability (always >= 50) -- see the field doc on
            Prediction. Use this for display instead of calibratedProbability.
        dataQuality:
          type: integer
        upsetRisk:
          $ref: "#/components/schemas/UpsetRisk"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        actualWinnerName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        usedHistoricalMatchFallback:
          type: boolean
          description: >-
            Task #30: true when player1 and/or player2 was resolved via the historical-match
            fallback (not in current live ATP/WTA standings) rather than a live ranking, per the
            real `engine.warnings` recorded at prediction time -- never a new guess.

    PredictionStats:
      type: object
      required: [totalPredictions, resolvedPredictions, correctPredictions, accuracy, byRecommendation]
      properties:
        totalPredictions:
          type: integer
        resolvedPredictions:
          type: integer
        correctPredictions:
          type: integer
        accuracy:
          type: ["number", "null"]
          description: correctPredictions / resolvedPredictions as a percentage, null if no resolved predictions yet
        byRecommendation:
          type: array
          items:
            type: object
            required: [recommendation, count]
            properties:
              recommendation:
                $ref: "#/components/schemas/Recommendation"
              count:
                type: integer

    RunKind:
      type: string
      enum: [historical_test, paper_trade, live, paper_trade_shadow]
      description: >-
        historical_test replays the leak-proof historical store for backtesting; paper_trade/live
        lock predictions for real fixtures ahead of time; paper_trade_shadow is a faster
        day-by-day historical replay of the SAME leak-proof scoring path, graded with today's
        active calibration to simulate what live paper trading would have produced -- always
        disclosed as simulated evidence, never merged with genuinely-live paper_trade/live rows.

    Segment:
      type: string
      enum: [validation, test]

    EvaluationStatus:
      type: string
      enum: [pending, graded, void, missed]

    ResultType:
      type: string
      enum: [normal, retired, walkover, cancelled]

    CalibrationKnot:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          description: Raw predicted probability (0-1)
        y:
          type: number
          description: Calibrated probability (0-1)

