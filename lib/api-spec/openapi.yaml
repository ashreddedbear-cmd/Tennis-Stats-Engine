        accuracy:
          type: ["number", "null"]
        logLoss:
          type: ["number", "null"]
        brier:
          type: ["number", "null"]
        dateRangeStart:
          type: ["string", "null"]
          format: date-time
        dateRangeEnd:
          type: ["string", "null"]
          format: date-time
        retiredCount:
